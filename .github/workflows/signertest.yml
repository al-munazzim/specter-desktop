          echo ""
          echo "=== Method 2: list-secret-keys --with-colons --with-fingerprint ==="
          gpg --list-secret-keys --with-colons --with-fingerprint 2>&1

          echo ""
          echo "=== Method 3: list-keys --with-colons --with-fingerprint ==="
          gpg --list-keys --with-colons --with-fingerprint 2>&1

          echo ""
          echo "=== Method 4: gpg --fingerprint --with-colons ==="
          gpg --fingerprint --with-colons 2>&1

          echo ""
          echo "=== Method 5: import with --import-options show-only ==="
          echo "$GPG_PRIVATE_KEY" | gpg --batch --with-colons --import-options import-show --dry-run --import 2>&1

          echo ""
          echo "=== Method 6: extract from gpg --fingerprint (human readable) ==="
          gpg --fingerprint 2>&1
          FPR=$(gpg --fingerprint --with-colons 2>&1 | awk -F: '/^fpr/{print $10; exit}')
          echo "Extracted FPR: $FPR"
